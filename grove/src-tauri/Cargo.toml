[package]
name = "grove"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
grove-core = { path = "../grove-core" }
tauri = { version = "2", features = ["macos-private-api", "devtools", "unstable"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
webbrowser = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
# Tauri's with_webview_configuration names WKWebViewConfiguration in its
# signature, so the type must come from the same crate (already in the lock file
# via wry — this adds no new version to the graph).
objc2-web-kit = "0.3"
