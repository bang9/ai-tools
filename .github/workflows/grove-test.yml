name: "grove: Test"

on:
  push:
    branches: [main]
    paths:
      - 'grove/**'
  pull_request:
    branches: [main]
    paths:
      - 'grove/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grove
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: grove/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  test-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grove
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # No tmux install: the PTY backend is grove-daemon, and nothing under test
      # shells out to tmux. The one remaining tmux caller (grove-core `tmux_sweep`,
      # the one-time reap of leftover sessions from a pre-daemon build) is a no-op
      # success when tmux is absent, and its tests assert that. Both suites are
      # verified green on a host with no tmux binary at all.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: grove

      - name: Run grove-core tests
        run: cargo test -p grove-core -- --test-threads=1

      - name: Run grove-daemon tests
        run: cargo test -p grove-daemon -- --test-threads=1
