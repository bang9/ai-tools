name: "grove: Test"

on:
  push:
    branches: [main]
    paths:
      - 'grove/**'
      - '.github/workflows/grove-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'grove/**'
      - '.github/workflows/grove-test.yml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grove
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: grove/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  # grove-core is portable — run it on the cheap Linux runner. (No tmux install:
  # the PTY backend is grove-daemon, and nothing under test shells out to tmux. The
  # one remaining tmux caller, grove-core `tmux_sweep`, is a no-op success when tmux
  # is absent and its tests assert that.)
  test-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grove
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: grove

      - name: Run grove-core tests
        run: cargo test -p grove-core -- --test-threads=1

  # grove-daemon owns the real PTY and its integration tests exercise macOS PTY /
  # shell / kernel behavior (sysctl KERN_PROC_PID, LOCAL_PEERPID, shell output
  # ordering under flow control). grove ships ONLY on macOS, so these must run on a
  # macOS runner to test what actually ships — on Linux the shell env and kernel
  # APIs differ and the peer-pid / process-facts paths are macOS-gated no-ops.
  test-daemon:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: grove
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: grove

      - name: Run grove-daemon tests
        run: cargo test -p grove-daemon -- --test-threads=1
