name: "claude-irc: Test"

on:
  push:
    branches: [main]
    paths:
      - 'claude-irc/**'
      - 'shared/upgrade/**'
  pull_request:
    branches: [main]
    paths:
      - 'claude-irc/**'
      - 'shared/upgrade/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.21'
          cache-dependency-path: claude-irc/go.sum

      - name: Run tests
        run: |
          cd claude-irc
          go test ./...
