name: "rewind: Test"

on:
  push:
    branches: [main]
    paths:
      - 'rewind/**'
      - 'shared/upgrade/**'
  pull_request:
    branches: [main]
    paths:
      - 'rewind/**'
      - 'shared/upgrade/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: rewind/go.mod
          cache-dependency-path: |
            rewind/go.sum
            rewind/go.mod

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9

      - name: Build frontend
        run: |
          cd rewind/web
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run tests
        run: |
          cd rewind
          go test ./...
