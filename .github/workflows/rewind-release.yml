name: "rewind: Release"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  release:
    runs-on: macos-latest
    env:
      GOTOOLCHAIN: local
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate release version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          version="$RAW_VERSION"
          semver_tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          case "$version" in
            *$'\n'*|*$'\r'*)
              echo "Invalid release version: must be a single-line semver tag" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$version" | grep -Eq "$semver_tag_pattern"; then
            echo "Invalid release version: must match semver tag format" >&2
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: rewind/go.mod
          cache-dependency-path: |
            rewind/go.sum
            rewind/go.mod

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9

      - name: Build frontend
        run: |
          cd rewind/web
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build binaries
        run: |
          cd rewind
          VERSION="$RELEASE_VERSION"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/rewind-darwin-arm64 ./cmd/rewind
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/rewind-darwin-amd64 ./cmd/rewind
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/rewind-linux-amd64 ./cmd/rewind

      - name: Generate checksums
        run: |
          cd rewind/dist
          shasum -a 256 * > rewind-checksums.txt

      - name: Upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_VERSION" \
            rewind/dist/rewind-darwin-arm64 \
            rewind/dist/rewind-darwin-amd64 \
            rewind/dist/rewind-linux-amd64 \
            rewind/dist/rewind-checksums.txt
